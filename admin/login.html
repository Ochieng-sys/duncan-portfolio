<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | OD Services</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body class="admin-page">


    <main class="login-container">

        <div class="login-card">

            <a
                href="../index.html"
                class="admin-brand"
            >
                OD Services
            </a>

            <p class="section-label">
                ADMINISTRATOR
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="login-description">
                Sign in to access the OD Services
                administration area.
            </p>

<form id="login-form">

    <input
        type="email"
        id="login-email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="login-password"
        placeholder="Password"
        required
    >

    <button
        type="submit"
        id="login-button"
    >
        Login
    </button>

    <p id="login-status"></p>

</form>

<script src="../js/login.js"></script>



            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to website
            </a>

        </div>

    </main>


    <script src="../js/admin.js"></script>

</body>

</html>
